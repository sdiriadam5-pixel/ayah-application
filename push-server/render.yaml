services:
  - type: web
    name: ayah-push
    runtime: node
    plan: starter
    rootDir: push-server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: ayah-push-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ORIGIN
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATA_DIR
        value: /var/data
